name: quality-checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      APP_PASSWORD_SALT: ci-test-salt
      APP_PASSWORD_HASH: ci-test-hash
      SESSION_SECRET: ci-session-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pytest fastapi uvicorn itsdangerous python-multipart numpy cryptography openai pymupdf python-docx openpyxl pandas xlrd pillow pytesseract boto3
      - run: python -m compileall -q app scripts tests
      - run: python -m pytest -q tests
      - run: node --check app/static/app.js
